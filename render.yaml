# Render blueprint for Playbook.
#
# The web service owns the persistent SQLite disk. Render cron jobs cannot
# mount disks, so the nightly scan is triggered over HTTP and executes inside
# the web service, where the price cache and scan history already live.
#
# Deploy: push this repo to GitHub, then New → Blueprint on render.com.

services:
  - type: web
    name: playbook
    runtime: python
    # The audited scan peaked above 300 MB before web-server overhead. Standard
    # leaves enough RAM for the site and gives the nightly job a full CPU.
    plan: standard
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py app:app
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: playbook-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: PLAYBOOK_DATA_CACHE
        value: /var/data/playbook.sqlite3
      - key: PLAYBOOK_UNIVERSE
        value: nasdaq
      - key: PLAYBOOK_SCAN_WORKERS
        value: "4"
      - key: PLAYBOOK_SCAN_REQUEST_INTERVAL
        value: "0.4"
      - key: PLAYBOOK_SCAN_RETRY_ATTEMPTS
        value: "3"
      - key: PLAYBOOK_SCAN_RETRY_BASE_SECONDS
        value: "2"
      - key: PLAYBOOK_SCAN_RETRY_MAX_SECONDS
        value: "30"
      - key: PLAYBOOK_SCAN_RETRY_JITTER_SECONDS
        value: "1"
      - key: PLAYBOOK_SCAN_RETENTION_RUNS
        value: "30"
      - key: PLAYBOOK_SCAN_TIME
        value: "17:15"
      # The in-process scheduler is the primary automation. The cron job below
      # is a belt-and-braces retry in case the web service restarted late.
      - key: PLAYBOOK_ENABLE_SCHEDULER
        value: "1"
      - key: PLAYBOOK_SCAN_TOKEN
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "8"
      - key: GUNICORN_TIMEOUT
        value: "180"

  - type: cron
    name: playbook-nightly-trigger
    runtime: python
    plan: starter
    region: oregon
    branch: main
    # 22:30 UTC is 18:30 EDT in summer and 17:30 EST in winter.
    # The scanner itself refuses to run before the close is confirmed, so an
    # early or late trigger is safe.
    schedule: "30 22 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python trigger_scan.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: PLAYBOOK_SCAN_URL
        fromService:
          type: web
          name: playbook
          property: hostport
      # Render private-network hostnames use HTTP. Public GitHub triggers keep
      # trigger_scan.py's HTTPS default.
      - key: PLAYBOOK_SCAN_SCHEME
        value: http
      - key: PLAYBOOK_SCAN_TOKEN
        fromService:
          type: web
          name: playbook
          envVarKey: PLAYBOOK_SCAN_TOKEN
